name: 发布 GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

      # 同一份产物同步到 Netlify（主站）。Netlify 跑在根路径，用 _redirects 把 GitHub Pages
      # 的 /Keil_Keygen_Web/ 子路径重写到根下同名文件。
      - name: 发布到 Netlify
        run: |
          rm -rf .netlify-out && mkdir .netlify-out
          cp -r site/. .netlify-out/
          echo '/Keil_Keygen_Web/*  /:splat  200' >> .netlify-out/_redirects
          npx --yes netlify-cli@26 deploy --prod --no-build --dir=.netlify-out --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
